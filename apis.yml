aid: fuse
name: Fuse
description: 'Fuse Energy is a UK retail energy supplier providing gas and electricity
  to homes and businesses, alongside EV charging, solar and battery storage tracking
  with grid export, and smart home energy management. The company emphasises savings
  against the UK price cap, a fast (~3 minute) online sign-up, automated supplier
  switching, and 24/7 customer support including an AI assistant called "Plugs".
  Fuse was surfaced as a portfolio company of Accel and Speedinvest and added to the
  API Evangelist network. It operates a consumer/business energy web and mobile
  experience and does not publish a public developer API program at this time.'
